<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>AI Panel self-test</title>
<link rel="stylesheet" href="/xterm/xterm.css">
<link rel="stylesheet" href="/ai-panel.css">
<script src="/xterm/xterm.js"></script>
<script src="/xterm/addon-fit.js"></script>
<style>
  /* a stand-in app: the Simple GLB Editor's theme tokens and the few app classes the panel relies on (.menu, .muted, .hint) */
  :root { --bg: #121418; --panel: #1c1f26; --panel2: #232731; --border: #2e333e; --text: #dfe3ea; --muted: #8b93a3; --accent: #4fc3f7; --accent2: #ffb74d; --danger: #ff5252;
    --ctl: #2b303b; --ctl-border: #3a404d; --ctl-hover: #353b48; --field: #15181d; --row-sel: #2a3f57; --title: #262b35; --menu: #232731; --menu-hover: #343a47;
    --primary: #1f6f95; --primary-border: #2b88b3; --primary-hover: #2681ad; --tint2: rgba(255,255,255,.1); --ai: #7e57c2; --ok: #81c784; color-scheme: dark; }
  :root[data-theme="light"] { --bg: #e9ebef; --panel: #f6f7f9; --panel2: #eceef2; --border: #cfd4dc; --text: #1d2229; --muted: #5d6675; --accent: #0277bd; --accent2: #c26a00; --danger: #d32f2f;
    --ctl: #ffffff; --ctl-border: #c3c9d3; --ctl-hover: #eef1f5; --field: #ffffff; --row-sel: #cfe3f7; --title: #e3e6eb; --menu: #ffffff; --menu-hover: #e8edf4;
    --primary: #0288d1; --primary-border: #0277bd; --primary-hover: #039be5; --tint2: rgba(0,0,0,.08); --ok: #2e7d32; color-scheme: light; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px system-ui, "Segoe UI", sans-serif; }
  header { padding: 8px 12px; background: var(--panel); font-weight: 600; }
  nav { display: flex; align-items: center; gap: 4px; padding: 3px 10px; background: var(--title); border-block: 1px solid var(--border); }
  .grow { flex: 1; } .muted { color: var(--muted); } .dropdown { position: relative; }
  .menu { position: absolute; top: 32px; left: 0; z-index: 20; min-width: 250px; padding: 5px; background: var(--menu); border: 1px solid var(--ctl-border); border-radius: 8px; display: flex; flex-direction: column; }
  .menu[hidden] { display: none; } .menu button { display: block; width: 100%; text-align: left; background: transparent; border: 0; color: var(--text); font: 13px system-ui, "Segoe UI", sans-serif; padding: 4px 9px; height: 28px; border-radius: 5px; cursor: pointer; }
  .menu button:hover { background: var(--menu-hover); } .menu hr { border: 0; border-top: 1px solid var(--border); width: 100%; }
  .menu-note { color: var(--muted); font-size: 11px; padding: 4px 8px; }
  #log { padding: 12px; white-space: pre-wrap; font: 12px Consolas, monospace; }
  body.termside #log { margin-right: calc(var(--term-w) + 12px); }
</style>
</head>
<body>
<header>🧪 AI Panel self-test</header>
<nav id="menubar"><span>File</span><span>View</span><span class="grow"></span><span id="aiPanelButton"></span></nav>
<div id="log">Fake assistant: ▾ › AI assistant › 🧪 Fake. Type "choices", "menu", "env" or "bye".</div>
<div id="aiPanelHost"></div>
<script type="module">
  import { initTerminal } from '/ai-panel.js';
  import { httpBridge } from '/bridge-http.js';
  const tpl = document.createElement('template'); tpl.innerHTML = await (await fetch('/ai-panel.html')).text();
  document.getElementById('aiPanelButton').replaceWith(tpl.content.querySelector('#claudeDropdown'));
  document.getElementById('aiPanelHost').replaceWith(tpl.content.querySelector('#term'));
  const store = {};
  window.panel = initTerminal({ appName: 'Self-test', status: t => { document.getElementById('log').textContent += '\n' + t; }, settings: { get: (k, d) => store[k] ?? d, set: (k, v) => { store[k] = v; } },
    workFolder: () => 'C:\\Windows\\Temp', workFolderName: 'Temp', bridge: httpBridge({ pickFolder: async () => null }), below: () => document.getElementById('menubar') });

  /** The answer bar against screens seen in real assistants: run  await choiceCases()  in the console. Each line must say "ok". */
  window.choiceCases = async () => {
    const W = '─'.repeat(70), t = window.panel._term, out = [];
    const cases = [ // [what, screen, expected buttons ('' = none)]
      ['message box with History open, wrapped text (Claude Code)', `Answer.\r\n\r\n── History 11/11 ${'─'.repeat(50)}\r\n❯ clouds and fog should be off in the editor by default and enabled\r\n  by options\r\n${W}\r\n  ⏵⏵ auto mode on`, ''],
      ['message box', `Answer.\r\n\r\n${W}\r\n❯ hello there\r\n${W}\r\n  ? for shortcuts`, ''],
      ['message box, wrapped text', `Answer.\r\n\r\n${W}\r\n❯ a long message that wraps onto the next line\r\n  and keeps going here\r\n${W}`, ''],
      ['an earlier message and its answer (Claude Code /model)', `\r\n❯ /model sonnet\r\n  ⎿  Set model to Sonnet 5.5 and saved as your default for new sessions\r\n\r\n\r\n\r\n${W}\r\n❯ \r\n${W}\r\n  ⏵⏵ auto mode on (shift+tab to cycle)`, ''],
      ['an earlier message, message box out of view', `\r\n❯ /model sonnet\r\n  ⎿  Set model to Sonnet 5.5\r\n\r\n${W}`, ''],
      ['trust question without numbers (Claude Code)', ` Security guide\r\n\r\n ❯ No, exit\r\n   Yes, I trust this folder\r\n\r\n Enter to confirm`, 'No, exit / Yes, I trust this folder'],
      ['Yes / No with the question at the same column (Kiro)', `┃\r\n  You are not logged in. Login now? \r\n> Yes\r\n  No`, 'Yes / No'],
      ['numbered menu', `Allow it?\r\n❯ 1. Yes\r\n  2. No`, 'Yes / No'],
      ['numbered list at the end of a message', `Pick one:\r\n1. Red\r\n2. Green\r\n3. Something else - type what you want`, 'Red / Green / Something else - type what you want'],
    ];
    for (const [what, screen, want] of cases) {
      t.reset(); await window.panel._write(screen);
      const c = window.panel._findChoices(), got = c ? c.options.map(o => o.text).join(' / ') : '';
      out.push(`${got === want ? 'ok  ' : 'FAIL'} ${what}${got === want ? '' : ` — got "${got}", want "${want}"`}`);
    }
    t.reset(); return out.join('\n');
  };
</script>
</body>
</html>
